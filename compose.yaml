services:
  redis:
    image: redis:alpine
    container_name: redis

  bookmark_service:
    image: sondo580/bookmark-service:v1.0.1
    restart: always
    depends_on:
      - redis
    container_name: bookmark_service
    env_file:
      - ./bookmark_service/.env

  portal:
    image: ebvn/bookmark-app-portal:mono
    container_name: portal

  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - bookmark_service
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
