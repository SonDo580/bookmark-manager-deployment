services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: always

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    env_file:
      - ./postgres/.env
    volumes:
      - pgdata:/var/lib/postgresql

  bookmark_service:
    image: sondo580/bookmark-service:v0.1.0
    container_name: bookmark_service
    depends_on:
      - redis
      - postgres
    env_file:
      - ./bookmark_service/.env

  portal:
    image: ebvn/bookmark-app-portal:mono
    container_name: portal
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - bookmark_service
      - portal
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata: